services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: vending-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vending_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-vending_db}
    # Bound strictly to loopback: reachable from host-side tooling (drizzle-kit
    # db:push/db:studio) via localhost:5432, but never exposed on the LAN/internet —
    # unlike a bare "5432:5432" mapping, which binds all interfaces (0.0.0.0).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vending_user} -d ${POSTGRES_DB:-vending_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vending-network

  # 2. Fastify Backend API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vending-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vending_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in your .env file}@db:5432/${POSTGRES_DB:-vending_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in your .env file}
      # Identifies the one root Super Admin account so it can never be
      # deactivated via the API (apps/api/src/modules/users/users.controller.ts).
      # Required — not just set for the seed script — because that guard
      # silently does nothing (rather than erroring) if this is unset.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL must be set in your .env file}
      # Required so `db:seed` (run by deploy.sh after every schema push) can
      # provision/repair the Super Admin's password hash from inside this
      # container — previously absent here entirely, so the seed step had no
      # way to know the account's password even when invoked.
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set in your .env file}
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vending-network

  # 3. Next.js Web Frontend Service
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vending-web
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vending-network

  # 4. Nginx Reverse Proxy Gateway
  nginx:
    image: nginx:alpine
    container_name: vending-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    networks:
      - vending-network

volumes:
  postgres_data:
    driver: local

networks:
  vending-network:
    driver: bridge
