services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: vending-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vending_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-vending_db}
    # Bound strictly to loopback: reachable from host-side tooling (drizzle-kit
    # db:push/db:studio) via localhost:5432, but never exposed on the LAN/internet —
    # unlike a bare "5432:5432" mapping, which binds all interfaces (0.0.0.0).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vending_user} -d ${POSTGRES_DB:-vending_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vending-network

  # 2. Fastify Backend API Service
  #
  # Pulled pre-built from GHCR (see .github/workflows/deploy.yml) rather than
  # built here — building on the VPS's 2 cores/~1GB RAM is what used to make
  # every deploy take 20-30 minutes. `docker-compose.override.yml` restores
  # `build:` for local dev, where Compose auto-merges it over this file.
  api:
    image: ghcr.io/${IMAGE_OWNER:-torikulislamhira}/vending-api:${IMAGE_TAG:-latest}
    container_name: vending-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vending_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in your .env file}@db:5432/${POSTGRES_DB:-vending_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in your .env file}
      # Identifies the one root Super Admin account so it can never be
      # deactivated via the API (apps/api/src/modules/users/users.controller.ts).
      # Required — not just set for the seed script — because that guard
      # silently does nothing (rather than erroring) if this is unset.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL must be set in your .env file}
      # Required so `db:seed` (run by deploy.sh after every schema push) can
      # provision/repair the Super Admin's password hash from inside this
      # container — previously absent here entirely, so the seed step had no
      # way to know the account's password even when invoked.
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set in your .env file}
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      # Optional automated Google Drive backups (core/backup/scheduler.ts) —
      # left unset, both scheduled jobs just no-op at startup.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GDRIVE_BACKUP_FOLDER_ID: ${GDRIVE_BACKUP_FOLDER_ID:-}
      GDRIVE_BACKUP_FOLDER_ID_CSV: ${GDRIVE_BACKUP_FOLDER_ID_CSV:-}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      # Issue/repair photos — named volume so they survive `up -d` recreating
      # this container on every deploy. Path must match uploads.controller.ts's
      # __dirname-resolved ISSUES_UPLOAD_DIR exactly. Shared with
      # docker-compose.green.yml so blue/green see the same photos.
      - uploads_data:/app/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy
    # Mirrors the Dockerfile's own HEALTHCHECK — restated here so
    # `docker compose up --wait` (see deploy.sh) has something to wait on
    # even if a future image swap ever drops the Dockerfile instruction.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - vending-network

  # 3. Next.js Web Frontend Service
  web:
    image: ghcr.io/${IMAGE_OWNER:-torikulislamhira}/vending-web:${IMAGE_TAG:-latest}
    container_name: vending-web
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    # VPS has 2 cores / ~1GB RAM — cap web so it can't starve api/db under load.
    cpus: "1.0"
    mem_limit: 400m
    depends_on:
      api:
        condition: service_healthy
    # start_period/retries are generous on purpose: a cold `next start` on
    # this VPS's 2 cores can take well over 15s, and a healthcheck that
    # gives up before the process is even ready would make --wait (and the
    # through-nginx check in deploy.sh) fail a perfectly good deploy.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    restart: unless-stopped
    networks:
      - vending-network

  # 4. Nginx Reverse Proxy Gateway
  nginx:
    image: nginx:alpine
    container_name: vending-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    networks:
      - vending-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  vending-network:
    driver: bridge
