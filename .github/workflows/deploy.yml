name: CI/CD Deployment to Production VPS

on:
  push:
    branches:
      - main
  # So a PR actually exercises the build (image build only, never pushed —
  # see the `gate` step below) instead of this workflow only ever running
  # on main. `on.push.branches: [main]` already means a non-PR push to any
  # other branch never triggers this workflow at all; this adds the one
  # other case that's expected to.
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      owner: ${{ steps.vars.outputs.owner }}
      should_publish: ${{ steps.gate.outputs.should_publish }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Compute image vars
        id: vars
        run: |
          # GHCR requires an all-lowercase image path — github.repository_owner
          # preserves the account's display case (TorikulIslamHira), so it has
          # to be lowercased explicitly rather than used as-is.
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # A single positive allow-list, computed once, reused by every step
      # below that must never run for a PR (or any other future trigger
      # type) — deliberately NOT `github.event_name != 'pull_request'`.
      # That phrasing is a denylist: it defaults to "allowed" for every
      # event type that exists today AND any trigger added to `on:` later,
      # so adding e.g. a `schedule:` trigger down the line would silently
      # start pushing images and deploying unless someone remembered to
      # also update this exact condition everywhere it's copied. An
      # allow-list defaults closed instead — a new trigger type is simply
      # not in it until someone deliberately adds it here.
      - name: "Gate: push images / deploy only for main (push or workflow_dispatch)"
        id: gate
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.gate.outputs.should_publish == 'true' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/vending-api:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/vending-api:latest
          # Links the GHCR package to this repo (shows up under the repo's
          # own Packages tab, gives it a package settings page at all) —
          # without this a package pushed by a workflow still exists but
          # has no visible connection back to where it came from.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.gate.outputs.should_publish == 'true' }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/vending-web:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/vending-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Only after an actual push/dispatch to main: a build-only PR run
      # never pushed anything, so there's nothing new to prune for.
      - name: Prune old api package versions (keep last 5)
        if: steps.gate.outputs.should_publish == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: vending-api
          package-type: container
          min-versions-to-keep: 5

      - name: Prune old web package versions (keep last 5)
        if: steps.gate.outputs.should_publish == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: vending-web
          package-type: container
          min-versions-to-keep: 5

  deploy:
    name: Deploy to Production VPS
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup SSH & Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # This deploy job's own short-lived token — only needs GHCR read
          # access (see `permissions:` above) to pull the images the build
          # job just pushed. Never written to .env; only exported for the
          # duration of this SSH session (see deploy.sh's ghcr login/logout).
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          IMAGE_OWNER: ${{ needs.build.outputs.owner }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # ServerAliveInterval/CountMax: send a keepalive probe every 60s and
          # tolerate up to 10 missed replies (10 minutes) before giving up.
          # An idle SSH connection can still get dropped by the client or by
          # NAT/firewall equipment in between — what "client_loop: send
          # disconnect: Broken pipe" actually is — even though deploy.sh no
          # longer runs a long image build here.
          SSH_CMD="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -p $VPS_PORT $VPS_USERNAME@$VPS_HOST"

          # Package the required secrets as a single base64 blob so their raw
          # values never have to be embedded/quoted directly on the SSH command
          # line — a secret containing $, `, quotes, or spaces could otherwise
          # be mis-parsed (or worse, re-interpreted) by the remote shell. The
          # blob itself is never echoed anywhere, so it never lands in logs.
          ENV_BLOB=$(printf 'SUPER_ADMIN_EMAIL=%s\nSUPER_ADMIN_PASSWORD=%s\nJWT_SECRET=%s\nPOSTGRES_PASSWORD=%s\n' \
            "$SUPER_ADMIN_EMAIL" "$SUPER_ADMIN_PASSWORD" "$JWT_SECRET" "$POSTGRES_PASSWORD" | base64 -w0)

          $SSH_CMD "ENV_BLOB='$ENV_BLOB' GH_PAT='$GH_PAT' GHCR_TOKEN='$GHCR_TOKEN' GHCR_ACTOR='$GHCR_ACTOR' IMAGE_TAG='$IMAGE_TAG' IMAGE_OWNER='$IMAGE_OWNER' bash -s" << 'EOF'
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # If this repo is private, every git operation against github.com
            # needs auth — GH_PAT (fine-grained, Contents: Read-only) is
            # optional here since a public repo needs no credentials at all.
            # When set, it's passed as a per-request HTTP header
            # (`-c http.extraheader=`) rather than embedded in the remote
            # URL, so it's never persisted into .git/config on disk or
            # exposed via `git remote -v`. Exported (not just a local var)
            # so deploy.sh's own git fetch — a separate process — inherits it.
            if [ -n "$GH_PAT" ]; then
              export GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"
            fi

            APP_DIR=""
            if [ -d "$HOME/Vending-Tracking" ]; then
              APP_DIR="$HOME/Vending-Tracking"
            elif [ -d "$HOME/bee-novelty" ]; then
              APP_DIR="$HOME/bee-novelty"
            elif [ -d "/var/www/Vending-Tracking" ]; then
              APP_DIR="/var/www/Vending-Tracking"
            else
              echo "📁 Cloning repository for initial VPS setup..."
              if [ -n "${GIT_AUTH_HEADER:-}" ]; then
                git -c http.extraheader="$GIT_AUTH_HEADER" clone https://github.com/TorikulIslamHira/Vending-Tracking.git "$HOME/Vending-Tracking"
              else
                git clone https://github.com/TorikulIslamHira/Vending-Tracking.git "$HOME/Vending-Tracking"
              fi
              APP_DIR="$HOME/Vending-Tracking"
            fi

            echo "📂 Navigating to application directory: $APP_DIR"
            cd "$APP_DIR"

            # Create default production .env from template if missing
            if [ ! -f .env ]; then
              echo "⚙️ Initializing .env configuration from template..."
              cp .env.production.example .env
            fi

            # Sync required secrets from GitHub Actions into the server's .env,
            # in place, without disturbing any other line already there. A key
            # is only written if this workflow run actually supplied a
            # non-empty value for it — an unconfigured GitHub secret leaves
            # whatever is already in .env untouched instead of blanking out a
            # working credential (e.g. an already-correct JWT_SECRET).
            echo "🔐 Syncing required secrets into .env..."
            echo "$ENV_BLOB" | base64 -d > /tmp/.env.secrets
            while IFS='=' read -r KEY VALUE; do
              [ -z "$KEY" ] && continue
              if [ -z "$VALUE" ]; then
                echo "  ⚠️  $KEY not provided by GitHub Secrets — keeping existing .env value"
                continue
              fi
              if grep -q "^${KEY}=" .env 2>/dev/null; then
                grep -v "^${KEY}=" .env > .env.tmp && mv .env.tmp .env
              fi
              printf '%s=%s\n' "$KEY" "$VALUE" >> .env
              echo "  ✅ $KEY synced from GitHub Secrets"
            done < /tmp/.env.secrets
            rm -f /tmp/.env.secrets

            # Clean any dirty local state and synchronize with origin/main
            if [ -n "${GIT_AUTH_HEADER:-}" ]; then
              git -c http.extraheader="$GIT_AUTH_HEADER" fetch origin main
            else
              git fetch origin main
            fi
            git reset --hard origin/main

            # Ensure deploy.sh is executable and execute deployment
            chmod +x deploy.sh
            ./deploy.sh
          EOF
