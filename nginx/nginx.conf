events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Docker's embedded DNS server. A classic `upstream { server web:3000; }`
    # block resolves "web"/"api" ONCE, when nginx starts — after
    # `docker compose up -d --no-deps api web` (deploy.sh's rolling update)
    # recreates those containers with new IPs, nginx keeps routing to the
    # old, now-dead IPs and every request 502s until nginx itself is
    # restarted. Declaring `resolver` + using a variable in `proxy_pass`
    # (below, in each location) instead makes nginx re-resolve the hostname
    # at request time, revalidating against Docker's DNS at most every 5s —
    # no reload tied to deploy timing required, and it's equally correct for
    # an unplanned container restart nothing in deploy.sh even sees.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 20M;

        # Through-nginx health check for deploy.sh/rollback.sh: a container
        # being "healthy" to Docker (curl from *inside* it, see
        # docker-compose.yml) doesn't prove nginx can actually reach it —
        # this exercises the real public path. Rewrites to the api's own
        # unprefixed /health (DB connectivity check, see apps/api/src/server.ts);
        # that route isn't exposed anywhere else.
        location = /api/v1/health {
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded issue/repair photos — matched before the general /api/
        # block below since it's the longer/more specific prefix. Filenames
        # are random UUIDs that are never rewritten in place (see
        # apps/api/src/server.ts), so a year-long immutable cache is safe.
        # Cache-Control is set by Fastify (@fastify/static's cacheControl/
        # maxAge/immutable options), not here — `add_header` was briefly
        # added on the premise that it would "restate/ensure" the same
        # header, but that's not what it does: it unconditionally adds its
        # own copy alongside whatever the upstream already sent, so the
        # response ended up with the same Cache-Control header twice.
        # Deliberately not duplicated here; apps/api/src/server.ts is the
        # single source of truth for this header.
        #
        # $request_uri appended explicitly: nginx's docs only define the
        # URI-passing rule for proxy_pass *without* a variable ("no URI in
        # the directive -> pass the original request URI unchanged") and
        # separately for a variable *with* a literal URI after it ("passed
        # as is, replacing the original URI") — the exact case here,
        # variable with no trailing URI at all, isn't spelled out either
        # way. Appending $request_uri removes the ambiguity instead of
        # relying on it: this is nginx's own documented workaround for
        # "resolve dynamically but still forward the original URI
        # unchanged" and is what the old `proxy_pass http://api_upstream;`
        # (no URI, no variable) already did.
        location /api/v1/uploads/ {
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Proxy
        location /api/ {
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Frontend Web Proxy — also the catch-all for Next.js's own static
        # asset paths (/_next/*, etc.): there's no dedicated location for
        # those on either the old config or this one, since `next start`
        # serves them itself and this block already proxies everything
        # that isn't /api/*.
        location / {
            set $web_upstream http://web:3000;
            proxy_pass $web_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
