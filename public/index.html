<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bee Vending</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
    text-align: center;
  }
  p { padding: 0 24px; font-size: 14px; color: #64748b; }
</style>
</head>
<body>
  <!--
    This file exists only because Capacitor's webDir must point at a real
    directory with content in it — the app never actually renders this in
    normal use. capacitor.config.ts's server.url loads the live production
    site directly, and that takes over before this ever paints. This is
    strictly the fallback for the rare case the device has no network path
    to the live server at all when the app launches.
  -->
  <p>Unable to reach the Bee Vending server. Check your connection and reopen the app.</p>
</body>
</html>
